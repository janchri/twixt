sample:
  name: Settings over twixt
common:
  platform_allow:
    - native_sim
  integration_platforms:
    - native_sim
  tags:
    - i2c
    - settings
tests:
  # MCU a, started by twister; pytest/test_settings.py starts b next to it
  sample.twixt.settings:
    extra_args: MCU=a
    harness: pytest
    required_applications:
      - name: sample.twixt.settings.mcu_b
  sample.twixt.settings.mcu_b:
    extra_args: MCU=b
    build_only: true
