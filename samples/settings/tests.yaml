sample:
  name: Settings over twixt
common:
  build_only: true
  tags:
    - i2c
    - settings
tests:
  sample.twixt.settings.native_sim.pico:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=pico
  sample.twixt.settings.native_sim.nrf:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=nrf
  sample.twixt.settings.nrf7002dk:
    platform_allow: nrf7002dk/nrf5340/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
  sample.twixt.settings.rpi_pico:
    platform_allow: rpi_pico/rp2040/mcuboot
    integration_platforms:
      - rpi_pico/rp2040/mcuboot
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
      - CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
