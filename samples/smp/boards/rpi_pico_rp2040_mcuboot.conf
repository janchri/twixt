# The USB device "twixt pico", brought up before main() (src/usb.c): the log on one CDC-ACM port,
# MCUmgr on another; the CDC-ACM driver must not log to itself
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# The log through the shell on the log port: the shell writes interrupt-driven and waits for the
# host instead of losing lines, which the console's poll_out does without hw-flow-control
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_PROMPT_UART=""
CONFIG_LOG_BACKEND_UART=n

# The DesignWare block stays the target: twixt,i2c-mm-gpio hands it its pins
CONFIG_I2C_MM_TARGET_REREGISTER=n

# The software controllers on the bus NACK their address during their own transfers, up to a
# request and a response of 64 bytes at 100 kHz
CONFIG_I2C_MM_NACK_RETRY_MS=20

# MCUmgr, to update the image over its USB port under MCUboot (smpmgr ... upgrade): img and os
# (reset, parameters)
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_REBOOT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
