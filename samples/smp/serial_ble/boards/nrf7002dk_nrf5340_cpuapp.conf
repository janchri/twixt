# The TWIS driver hands over whole messages
CONFIG_I2C_TARGET_BUFFER_MODE=y
CONFIG_I2C_NRFX_TWIS_BUF_SIZE=64
CONFIG_TWIXT_LINK_NACK_RETRY_MS=20

# The image comes over the bus: MCUmgr's img group under MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_REBOOT=y

# A connection, identity and advertising set per MCU, large packets, on the network core's
# controller (hci_ipc.conf)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_ID_MAX=2
CONFIG_BT_MAX_CONN=2
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502

# The icmsg link between the cores carries HCI packets up to CONFIG_BT_BUF_ACL_RX_SIZE
CONFIG_PBUF_RX_READ_BUF_SIZE=1024
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_STACK_SIZE=2560
