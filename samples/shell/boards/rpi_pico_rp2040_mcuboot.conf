# The bridge's ports to the laptop: USB CDC-ACM, set up in src/bridge.c
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# The bridge's own shell (twixt ping, ...) on its console port
CONFIG_SHELL=y
CONFIG_SHELL_VT100_COLORS=n
# The log goes to a CDC-ACM port: the class driver itself must not log
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y


# A peer NACKs during its own transfers: a request and a response of 64 bytes at 100 kHz
CONFIG_TWIXT_LINK_NACK_RETRY_MS=20

# MCUmgr, to update the image over USB
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_REBOOT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
