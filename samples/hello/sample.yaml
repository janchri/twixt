sample:
  name: Hello over twixt
common:
  platform_allow:
    - native_sim
  integration_platforms:
    - native_sim
  tags:
    - i2c
tests:
  # MCU a, started by twister; pytest/test_hello.py starts b next to it
  sample.twixt.hello:
    extra_args: MCU=a
    harness: pytest
    required_applications:
      - name: sample.twixt.hello.mcu_b
  sample.twixt.hello.mcu_b:
    extra_args: MCU=b
    build_only: true
