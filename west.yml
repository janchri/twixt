# Standalone workspace for twixt (west init -m https://github.com/janchri/twixt).
# Other workspaces add twixt as a project instead, see README.md.

manifest:
  version: "0.13"

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  self:
    path: twixt

  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v4.5.0-rc2
      import:
        # What the samples need: the Raspberry Pi Pico and the nRF7002 DK,
        # MCUboot (with its crypto) and MCUmgr
        name-allowlist:
          - cmsis_6
          - hal_nordic
          - hal_rpi_pico
          - mbedtls
          - mcuboot
          - tf-psa-crypto
          - zcbor
