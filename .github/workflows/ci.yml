name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: clang-format
        if: ${{ !cancelled() }}
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror

      - name: ruff check
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Commit messages
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable base: check its last commit
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD~1"
          fi
          gitlint --commits "$BASE..$HEAD"

  twister:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: twixt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: zephyrproject-rtos/action-zephyr-setup@v1.0.9
        with:
          app-path: twixt
          toolchains: arm-zephyr-eabi

      # The platforms come from platform_allow in each tests.yaml
      - name: Run the tests on native_sim, build everything else
        run: west twister --all -T twixt --inline-logs --outdir twister-out

      - name: Keep the results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: |
            twister-out/twister.json
            twister-out/twister.log
            twister-out/**/handler.log
            twister-out/**/twister_harness.log
          retention-days: 7
