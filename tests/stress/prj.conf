# Twixt (CONFIG_TWIXT) and the bus port (CONFIG_I2C_MM_NATIVE) come with
# the devicetree, boards/native_sim.overlay
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ASSERT=y
CONFIG_CRC=y
CONFIG_ENTROPY_GENERATOR=y

# Settings in NVS on the simulated flash (storage_partition), served to the
# other MCUs by name
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_TWIXT_SETTINGS=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The MCUs are processes that meet in wall-clock time
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
