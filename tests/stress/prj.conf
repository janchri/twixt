# CONFIG_TWIXT, the bus port and CONFIG_UART_TWIXT come with the devicetree
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# Every MCU has a shell: the boards on a UART over the bus to the gateway, the gateway on its
# own port to the host. The log stays off the shell.
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STACK_SIZE=4096

# The echo load the test starts on every MCU: twixt stress
CONFIG_TWIXT_STRESS=y
