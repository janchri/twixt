common:
  tags:
    - i2c
    - shell
tests:
  # The gateway, started by twister; pytest/ starts the boards a and b next to
  # it, on the same virtual bus, and runs "twixt stress" on all three through
  # the gateway's PTYs
  twixt.stress:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=gw
    harness: pytest
    harness_config:
      # the MCUs run through all cells
      pytest_dut_scope: session
    timeout: 600
    required_applications:
      - name: twixt.stress.mcu_a
      - name: twixt.stress.mcu_b
  twixt.stress.mcu_a:
    platform_allow: native_sim
    extra_args: MCU=a
    build_only: true
  twixt.stress.mcu_b:
    platform_allow: native_sim
    extra_args: MCU=b
    build_only: true
  # On real boards (README): board b on an nRF7002 DK, the DUT, and the gateway
  # on a Raspberry Pi Pico; with --device-testing, twister flashes both and
  # pytest/ runs the matrix of b and gw through the gateway's USB ports
  twixt.stress.nrf7002dk:
    platform_allow: nrf7002dk/nrf5340/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    extra_args: MCU=b
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      required_devices:
        - platform: rpi_pico/rp2040/mcuboot
          application: twixt.stress.rpi_pico
    timeout: 600
  # The gateway on the Pico: the image alone, signed for the MCUboot that is on
  # the Pico (README), so that the smp runner can send it over MCUmgr
  twixt.stress.rpi_pico:
    platform_allow: rpi_pico/rp2040/mcuboot
    integration_platforms:
      - rpi_pico/rp2040/mcuboot
    extra_args: MCU=gw
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
      - CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
    build_only: true
