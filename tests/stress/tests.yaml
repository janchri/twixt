common:
  tags:
    - i2c
    - shell
tests:
  # The bridge is the DUT; pytest/ starts the boards and reaches all shells through its PTYs
  twixt.stress:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=pico
    harness: pytest
    harness_config:
      # the MCUs run through all cells
      pytest_dut_scope: session
    timeout: 600
    required_applications:
      - application: twixt.stress.mcu_nrf2
      - application: twixt.stress.mcu_nrf
  twixt.stress.mcu_nrf2:
    platform_allow: native_sim
    extra_args: MCU=nrf2
    build_only: true
  twixt.stress.mcu_nrf:
    platform_allow: native_sim
    extra_args: MCU=nrf
    build_only: true
  # Real boards: nrf on the DK is the DUT, the Pico a required device
  twixt.stress.nrf7002dk:
    platform_allow: nrf7002dk/nrf5340/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
    extra_args: MCU=nrf
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      required_devices:
        - platform: rpi_pico/rp2040/mcuboot
          application: twixt.stress.rpi_pico
    timeout: 600
  # The image alone, signed for the MCUboot on the Pico, for the smp runner
  twixt.stress.rpi_pico:
    platform_allow: rpi_pico/rp2040/mcuboot
    integration_platforms:
      - rpi_pico/rp2040/mcuboot
    extra_args: MCU=pico
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
      - CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
    build_only: true
